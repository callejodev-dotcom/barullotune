name: Compilar e publicar Barullo Tune

# Se ejecuta en cada subida (para comprobar que todo compila y pasa las pruebas)
# y, al subir una etiqueta "v0.4.0", "v0.5.0"…, publica una versión con los instaladores.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  JUCE_TAG: "8.0.4"

jobs:
  mac:
    name: Mac (Apple Silicon + Intel)
    runs-on: macos-14
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_DEV_ID: ${{ secrets.MACOS_DEV_ID }}
      MACOS_INSTALLER_ID: ${{ secrets.MACOS_INSTALLER_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Versión
        run: echo "VER=$(grep -oE 'project\(BarulloTune VERSION [0-9.]+' CMakeLists.txt | awk '{print $3}')" >> "$GITHUB_ENV"
      - name: JUCE
        run: git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
      - name: Compilar (universal)
        run: |
          set -o pipefail
          ( cmake -B build -G Xcode -DJUCE_DIR="$RUNNER_TEMP/JUCE" -DBARULLO_TESTS=ON -DBARULLO_WERROR=ON -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            && cmake --build build --config Release -j 4 ) 2>&1 | tee build.log \
            || { grep -E "error:|CMake Error" build.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Proba de son (afinación, bloques e estado)
        run: ./build/BTRenderTest_artefacts/Release/BTRenderTest prueba.wav --json metricas.json
      - name: Métricas (sen retrocesos respecto da base)
        run: python3 tools/compara.py tools/metricas-base.json metricas.json
      - name: Detector en condicións difíciles
        run: |
          ./build/BTDetectorTest_artefacts/Release/BTDetectorTest --json detector.json
          python3 tools/compara.py tools/detector-base.json detector.json
      - name: pluginval (VST3, nivel 10)
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pv.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --skip-gui-tests \
            "build/BarulloTune_artefacts/Release/VST3/Barullo Tune.vst3"
      - name: Certificado de Apple (solo si está configurado)
        if: env.MACOS_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/firma.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security list-keychain -d user -s "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KC"
      - name: Empaquetar (.pkg y .zip)
        run: |
          chmod +x packaging/package_mac.sh
          packaging/package_mac.sh build/BarulloTune_artefacts/Release "$VER" dist
      - name: Validar el AU (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/BarulloTune_artefacts/Release/AU/Barullo Tune.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumf Btun Esco
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Versión
        run: echo "VER=$(grep -oE 'project\(BarulloTune VERSION [0-9.]+' CMakeLists.txt | awk '{print $3}')" >> "$GITHUB_ENV"
      - name: JUCE
        run: git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$(cygpath -m "$RUNNER_TEMP")/JUCE"
      - name: Compilar
        run: |
          set -o pipefail
          JUCE="$(cygpath -m "$RUNNER_TEMP")/JUCE"
          ( cmake -B build -A x64 -DJUCE_DIR="$JUCE" -DBARULLO_TESTS=ON && cmake --build build --config Release -j 4 ) 2>&1 | tee build.log \
            || { grep -E "error|Error|CMake Error" build.log | grep -v "error.h\|-Werror\|onerror" | head -10 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Proba de son
        run: ./build/BTRenderTest_artefacts/Release/BTRenderTest.exe prueba.wav --json metricas.json
      - name: Métricas (sen retrocesos respecto da base)
        run: python tools/compara.py tools/metricas-base.json metricas.json
      - name: Detector en condicións difíciles
        run: |
          ./build/BTDetectorTest_artefacts/Release/BTDetectorTest.exe --json detector.json
          python tools/compara.py tools/detector-base.json detector.json
      - name: pluginval (VST3, nivel 10)
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q pv.zip
          ./pluginval.exe --strictness-level 10 --validate-in-process --skip-gui-tests \
            "build/BarulloTune_artefacts/Release/VST3/Barullo Tune.vst3"
      - name: Instalador (Inno Setup)
        run: |
          if ! command -v iscc >/dev/null 2>&1 && [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then choco install innosetup -y --no-progress; fi
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          ART="$(cygpath -w "$PWD/build/BarulloTune_artefacts/Release")"
          OUT="$(cygpath -w "$PWD/dist")"
          "$ISCC" "//DAppVersion=$VER" "//DArtDir=$ART" "//DOutDir=$OUT" packaging/windows.iss
      - name: Zip portátil
        run: |
          D="BarulloTune-$VER-windows-x64"
          mkdir -p "$D"
          cp -R "build/BarulloTune_artefacts/Release/VST3/Barullo Tune.vst3" "$D/"
          cp "build/BarulloTune_artefacts/Release/Standalone/Barullo Tune.exe" "$D/"
          [ -e "build/BarulloTune_artefacts/Release/CLAP/Barullo Tune.clap" ] && cp "build/BarulloTune_artefacts/Release/CLAP/Barullo Tune.clap" "$D/"
          cp packaging/LEEME-windows.txt "$D/LEEME.txt"
          7z a -tzip "dist/$D.zip" "$D" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04   # glibc antigua: así funciona también en distribuciones de hace unos años
    steps:
      - uses: actions/checkout@v4
      - name: Versión
        run: echo "VER=$(grep -oE 'project\(BarulloTune VERSION [0-9.]+' CMakeLists.txt | awk '{print $3}')" >> "$GITHUB_ENV"
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libxext-dev libfreetype6-dev libfontconfig1-dev ninja-build xvfb
      - name: JUCE
        run: git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
      - name: Compilar
        run: |
          set -o pipefail
          ( cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="$RUNNER_TEMP/JUCE" -DBARULLO_TESTS=ON && cmake --build build ) 2>&1 | tee build.log \
            || { grep -E "error:|CMake Error" build.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Proba de son
        run: ./build/BTRenderTest_artefacts/Release/BTRenderTest prueba.wav --json metricas.json
      - name: Métricas (sen retrocesos respecto da base)
        run: python3 tools/compara.py tools/metricas-base.json metricas.json
      - name: Detector en condicións difíciles
        run: |
          ./build/BTDetectorTest_artefacts/Release/BTDetectorTest --json detector.json
          python3 tools/compara.py tools/detector-base.json detector.json
      - name: Voces reais (sen retrocesos respecto da base)
        run: |
          mkdir -p "$RUNNER_TEMP/voces" && cd "$RUNNER_TEMP/voces"
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/spotify/basic-pitch && (cd basic-pitch && git sparse-checkout set tests/resources)
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/nnsvs/nnsvs && (cd nnsvs && git checkout -q HEAD -- tests/data)
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/MTG/essentia && (cd essentia && git checkout -q HEAD -- src/examples/python/musicbricks-tutorials)
          cd "$GITHUB_WORKSPACE"
          python3 -m pip install -q numpy scipy
          python3 tools/banco.py build/BTRenderTest_artefacts/Release/BTRenderTest "$RUNNER_TEMP/voces" --json banco.json
          python3 tools/compara.py tools/banco-base.json banco.json
      - name: pluginval (VST3, nivel 10, con interfaz)
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pv.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process \
            "build/BarulloTune_artefacts/Release/VST3/Barullo Tune.vst3"
      - name: clap-validator (CLAP)
        run: |
          curl -sSL -o cv.zip https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-ubuntu-22.04.zip
          unzip -q cv.zip -d cv && (cd cv && for t in *.tar.gz; do [ -e "$t" ] && tar xzf "$t"; done; true)
          CV=$(find cv -name clap-validator -type f | head -1); chmod +x "$CV"
          "$CV" validate "build/BarulloTune_artefacts/Release/CLAP/Barullo Tune.clap"
      - name: Empaquetar (.tar.gz)
        run: |
          chmod +x packaging/package_linux.sh
          packaging/package_linux.sh build/BarulloTune_artefacts/Release "$VER" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  sanitizadores:
    name: Memoria e comportamento indefinido (ASan + UBSan)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libxext-dev libfreetype6-dev libfontconfig1-dev ninja-build
      - name: JUCE
        run: git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
      - name: Compilar a proba con sanitizadores
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DJUCE_DIR="$RUNNER_TEMP/JUCE" -DBARULLO_TESTS=ON -DBARULLO_SANITIZE=ON
          cmake --build build --target BTRenderTest BTDetectorTest
      - name: Proba de son con sanitizadores
        run: |
          ./build/BTRenderTest_artefacts/RelWithDebInfo/BTRenderTest
          ./build/BTDetectorTest_artefacts/RelWithDebInfo/BTDetectorTest

  publicar:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows, linux, sanitizadores]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Barullo Tune ${{ github.ref_name }}
          body_path: packaging/NOTAS-VERSION.md
          files: dist/*
