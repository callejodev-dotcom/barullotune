name: Compilar e publicar Barullo Tune

# A CI común de Escoita (escoita-nucleo): en cada subida compila en Mac, Windows e Linux e pasa
# as probas (tools/probas-ci.sh); ao subir unha etiqueta «v0.4.0»… publica a versión cos instaladores.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  plugin:
    uses: callejodev-dotcom/escoita-nucleo/.github/workflows/plugin.yml@v0.1.0
    secrets: inherit
    permissions:
      contents: write
    with:
      sanitizadores: "BTRenderTest BTDetectorTest"
